<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flight details</title>
    <link rel="stylesheet" href="searchflight.css">
</head>
<body>
     <!-- Results Section (Appears after searching) -->
        <div id="resultsContainer">
            <h3>Available Flights & Airport Details:</h3>
            <div id="flightList"></div>
        </div>

        <!-- Passenger Details Modal (Appears after clicking Book Now) -->
        <div id="bookingModal" class="hidden">
            <h3>🎫 Enter Passenger Details</h3>
            <form id="bookingForm">
                <p id="selectedFlightInfo" style="font-weight: bold; color: #007bff;"></p>
                <div class="form-group">
                    <label for="passengerName">Full Name:</label>
                    <input type="text" id="passengerName" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="passengerEmail">Email:</label>
                    <input type="email" id="passengerEmail" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label for="passengerPhone">Phone Number:</label>
                    <input type="tel" id="passengerPhone" placeholder="10-digit mobile number" required>
                </div>
                <button type="submit" class="confirm-btn">Confirm Booking</button>
            </form>
        </div>

        <!-- Success Message -->
        <div id="successMessage" class="hidden"></div>
    </div>


    <script src="home.js"></script>
</body>
</html>
