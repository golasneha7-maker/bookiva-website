<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
   <div class="profile-page">

  <header class="user-info">
    <div class="avatar">User</div>
    <h3>User Name</h3>
    <p>+91 000000 0000</p>
  </header>


  <div class="wallet-section">
    <p>Wallet Balance: <strong>₹0</strong></p>
  </div>


  <nav class="profile-menu">
    <div class="menu-item booking" >📅 My Bookings</div>
    <div class="menu-item payment">💳 payment Methods</div>
    <div class="menu-item">📍 Saved Addresses</div>
    <div class="menu-item logout">🚪 Log Out</div>
  </nav>
</div>




<script>
  document.querySelector('.menu-item.booking').addEventListener('click', function() {
    // Clear user session or token here if applicable
    alert('You have been redirected to your bookings.');
    window.location.href = 'My Booking.html'; // Redirect to login page
  });

  document.querySelector('.menu-item.payment').addEventListener('click', function() {
    // Clear user session or token here if applicable
    alert('You have been redirected to payment methods.');
    window.location.href = 'payment.html'; // Redirect to login page
  });

  document.querySelector('.menu-item.logout').addEventListener('click', function() {
    // Clear user session or token here if applicable
    alert('You have been logged out.');
    window.location.href = 'index.html'; // Redirect to login page
  });


</script>







</body>
</html>
