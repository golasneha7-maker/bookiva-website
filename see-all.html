        /* सर्च बार की स्टाइलिंग */
        #searchInput { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 25px; box-sizing: border-box; }
        
        /* Grid Layout */
        .destinations-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .dest-card { background: white; padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .dest-card img { width: 100%; height: 150px; border-radius: 12px; object-fit: cover; margin-bottom: 10px;display: block; }
    </style>
</head>

<script>
    function filterDestinations() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let cards = document.getElementsByClassName('dest-card');
        
        for (let i = 0; i < cards.length; i++) {
            let name = cards[i].querySelector('.dest-name').innerText.toLowerCase();
            if (name.includes(input)) {
                cards[i].style.display = "";
            } else {
                cards[i].style.display = "none";
            }
        }
    }
</script>

</body>
